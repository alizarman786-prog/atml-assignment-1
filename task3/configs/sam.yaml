# Task 3, Step 3: SAM. Main comparison uses rho=0.05.
method: sam
seed: 6304
data_root: ./data_raw
splits_path: ../shared/splits/pacs_splits_seed6304.json

source_domains: [photo, art_painting, cartoon]
target_domain: sketch
num_classes: 7

training:
  max_epochs: 30
  steps_per_epoch: 50
  lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 5
  batch_size_per_domain: 8
  rho: 0.05

output:
  checkpoints_dir: results/checkpoints
  results_json: results/sam_seed6304.json
