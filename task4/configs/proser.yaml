# Task 4, Step 4: PROSER (classifier + data placeholders).
# Initializes from the Vanilla checkpoint -- run configs/vanilla.yaml first.
method: proser
seed: 6304
data_root: ./data_raw
num_classes: 10
vanilla_checkpoint: results/checkpoints/vanilla.pt

training:
  max_epochs: 50
  batch_size: 128
  lr: 1.0e-3
  momentum: 0.9
  weight_decay: 5.0e-4
  num_dummy: 5
  beta: 1.0
  gamma: 0.1

output:
  checkpoints_dir: results/checkpoints
  results_json: results/proser_seed6304.json
