# Task 2, Step 3: DANN (adversarial alignment, gradient reversal).
method: dann
seed: 6304
data_root: ./data_raw
splits_path: ../shared/splits/pacs_splits_seed6304.json

source_domains: [photo, art_painting, cartoon]
target_domain: sketch
num_classes: 7

training:
  max_epochs: 30
  steps_per_epoch: 50
  lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 5
  batch_size_per_domain: 8
  target_batch_size: 24
  max_alpha: 1.0   # main comparison; Step 6 controlled study varies this over {0.25, 0.5, 1}

output:
  results_dir: results
  checkpoints_dir: results/checkpoints
  results_json: results/dann_seed6304.json
